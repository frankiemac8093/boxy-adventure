const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const soundBtn = document.getElementById('soundBtn');

// ---------- Sound ----------
let audioCtx = null;
let soundEnabled = getSavedSoundEnabled();

function getSavedSoundEnabled() {
  try {
    return localStorage.getItem('boxySound') !== 'off';
  } catch {
    return true;
  }
}

function saveSoundEnabled() {
  try {
    localStorage.setItem('boxySound', soundEnabled ? 'on' : 'off');
  } catch {
    // localStorage can be unavailable in some privacy modes.
  }
}

function updateSoundButton() {
  soundBtn.textContent = soundEnabled ? '♪' : '×';
  soundBtn.classList.toggle('off', !soundEnabled);
  soundBtn.setAttribute('aria-label', soundEnabled ? 'Mute sound' : 'Turn sound on');
}

async function unlockAudio() {
  if (!soundEnabled) return false;
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtor) return false;
  if (!audioCtx) audioCtx = new AudioCtor();
  if (audioCtx.state === 'suspended') {
    try {
      await audioCtx.resume();
    } catch {
      return false;
    }
  }
  return audioCtx.state === 'running';
}

async function primeAudio() {
  const ready = await unlockAudio();
  if (!ready || !audioCtx || !soundEnabled) return false;

  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.02);
  return true;
}

function playTone(freq, duration = 0.12, type = 'square', volume = 0.08, delay = 0) {
  if (!soundEnabled) return;
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => playTone(freq, duration, type, volume, delay)).catch(() => {});
    return;
  }

  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration + 0.02);
}

function playSound(name) {
  if (name === 'jump') {
    playTone(320, 0.08, 'square', 0.12);
    playTone(520, 0.11, 'square', 0.1, 0.04);
  } else if (name === 'coin') {
    playTone(880, 0.07, 'triangle', 0.11);
    playTone(1320, 0.09, 'triangle', 0.1, 0.06);
  } else if (name === 'hurt') {
    playTone(180, 0.11, 'sawtooth', 0.12);
    playTone(110, 0.16, 'sawtooth', 0.1, 0.08);
  } else if (name === 'complete') {
    playTone(523, 0.1, 'triangle', 0.11);
    playTone(659, 0.1, 'triangle', 0.11, 0.1);
    playTone(784, 0.16, 'triangle', 0.12, 0.2);
  } else if (name === 'win') {
    playTone(659, 0.12, 'triangle', 0.12);
    playTone(784, 0.12, 'triangle', 0.12, 0.12);
    playTone(988, 0.22, 'triangle', 0.13, 0.24);
  }
}

// ---------- Mutable world (set by loadLevel) ----------
let platforms = [];
let clouds = [];
let hills = [];
let flowers = [];
let coins = [];
let waterGaps = [];
let jungleTrees = [];
let WORLD_W = 0;
let finishX = 0;
let skyTop = '#4FC3F7', skyBottom = '#B3E5FC';
let currentTheme = THEMES.meadow;

// ---------- Camera & particles ----------
let camX = 0;
let particles = [];

// ---------- Game state ----------
let currentLevel = 0;
let state = 'playing';   // 'playing' | 'eaten' | 'complete' | 'won'
let completeTimer = 0;
let eatenTimer = 0;
let eatenScene = null;
let score = 0;            // coins on current level
let totalScore = 0;       // coins collected across all levels

function loadLevel(index) {
  const L = LEVELS[index];
  WORLD_W = L.width;
  finishX = L.finishX;
  skyTop = L.skyTop;
  skyBottom = L.skyBottom;
  currentTheme = THEMES[L.theme] || THEMES.meadow;

  platforms = L.platforms.map(p => ({ ...p }));
  waterGaps = (L.waterGaps || []).map(w => ({ ...w, y: GROUND_Y, h: H - GROUND_Y }));

  jungleTrees = [];
  if (L.theme === 'jungle') {
    const treeCount = Math.ceil(WORLD_W / 230);
    for (let i = 0; i < treeCount; i++) {
      jungleTrees.push({
        x: i * 240 + 40 + Math.random() * 100,
        h: 115 + Math.random() * 90,
        w: 36 + Math.random() * 22,
        crown: 42 + Math.random() * 24,
      });
    }
  }

  // flowers on ground sections
  flowers = [];
  for (const p of platforms.filter(p => p.ground)) {
    for (let i = 0; i < p.w / 50; i++) {
      if (Math.random() < 0.55) {
        flowers.push({
          x: p.x + 15 + Math.random() * (p.w - 30),
          y: p.y - 2,
          color: currentTheme.flowers[Math.floor(Math.random() * currentTheme.flowers.length)],
        });
      }
    }
  }

  // clouds
  clouds = [];
  const cloudCount = Math.floor(WORLD_W / 200);
  for (let i = 0; i < cloudCount; i++) {
    clouds.push({
      x: Math.random() * WORLD_W,
      y: 30 + Math.random() * 140,
      s: 0.6 + Math.random() * 0.8,
      speed: 0.2 + Math.random() * 0.3,
    });
  }

  // hills
  hills = [];
  const hillCount = Math.ceil(WORLD_W / 280);
  for (let i = 0; i < hillCount; i++) {
    hills.push({
      x: i * 320 + Math.random() * 100,
      r: 110 + Math.random() * 80,
    });
  }

  // coins
  coins = L.coinSpots.map(([x, y]) => ({
    x, y, taken: false, t: Math.random() * Math.PI * 2,
  }));

  // reset player
  placePlayer(80, 200);
  camX = 0;
  particles = [];
  score = 0;
  eatenTimer = 0;
  eatenScene = null;
}

function placePlayer(x, y) {
  player.x = x;
  player.y = y;
  player.vx = 0;
  player.vy = 0;
  player.facing = 1;
  player.onGround = false;
  player.squash = 1;
}

function respawnPlayer() {
  playSound('hurt');
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#FF5252', 18);
  placePlayer(80, 200);
  camX = Math.max(0, Math.min(WORLD_W - W, player.x - W / 2));
  spawnParticles(player.x + player.w / 2, player.y + player.h, '#81D4FA', 12);
}

function finishAlligatorRespawn() {
  placePlayer(80, 200);
  camX = Math.max(0, Math.min(WORLD_W - W, player.x - W / 2));
  spawnParticles(player.x + player.w / 2, player.y + player.h, '#81D4FA', 12);
  state = 'playing';
  eatenTimer = 0;
  eatenScene = null;
}

function startAlligatorEating(water) {
  if (state !== 'playing') return;
  playSound('hurt');
  state = 'eaten';
  eatenTimer = 58;
  eatenScene = {
    x: water.x + water.w / 2,
    y: water.y + 24,
    scale: Math.max(0.78, Math.min(1.18, water.w / 110)),
    boxStartX: player.x + player.w / 2,
    boxStartY: player.y + player.h / 2,
  };
  player.vx = 0;
  player.vy = 0;
  jumpBuffer = 0;
  spawnParticles(eatenScene.x, water.y + 10, '#00BCD4', 18);
  spawnParticles(eatenScene.x, water.y - 2, '#2E7D32', 10);
}

function performJump(withSound = true) {
  if (state !== 'playing' || !player.onGround) return false;
  player.vy = -player.jumpPower;
  player.onGround = false;
  player.squash = 1.4; // stretch up
  jumpBuffer = 0;
  if (withSound) playSound('jump');
  spawnParticles(player.x + player.w/2, player.y + player.h, '#A5D6A7', 6);
  return true;
}

function restartGame() {
  retryBtn.classList.remove('show');
  retryBtn.blur(); // so Space/Enter don't re-trigger the button
  for (const code in keys) keys[code] = false;
  jumpBuffer = 0;
  currentLevel = 0;
  totalScore = 0;
  loadLevel(0);
  state = 'playing';
}

// ---------- Input ----------
const keys = {};
let jumpBuffer = 0;
window.addEventListener('keydown', e => {
  primeAudio();
  keys[e.code] = true;
  if (e.code === 'Space') jumpBuffer = 8;
  if (['ArrowLeft','ArrowRight','Space','KeyA','KeyD'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function bindHoldButton(id, code, onPress = null) {
  const button = document.getElementById(id);
  const setPressed = pressed => {
    keys[code] = pressed;
    button.classList.toggle('pressed', pressed);
  };
  button.addEventListener('pointerdown', e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    setPressed(true);
    const audioReady = primeAudio();
    if (onPress) onPress(audioReady);
  });
  button.addEventListener('touchstart', e => {
    e.preventDefault();
    setPressed(true);
    const audioReady = primeAudio();
    if (onPress) onPress(audioReady);
  }, { passive: false });
  for (const eventName of ['touchend', 'touchcancel']) {
    button.addEventListener(eventName, () => setPressed(false), { passive: false });
  }
  for (const eventName of ['pointerup', 'pointercancel', 'pointerleave']) {
    button.addEventListener(eventName, () => setPressed(false));
  }
  for (const eventName of ['contextmenu', 'selectstart', 'dragstart']) {
    button.addEventListener(eventName, e => e.preventDefault());
  }
}

bindHoldButton('leftBtn', 'ArrowLeft');
bindHoldButton('rightBtn', 'ArrowRight');
bindHoldButton('jumpBtn', 'Space', audioReady => {
  jumpBuffer = 8;
  const jumped = performJump(false);
  if (jumped) audioReady.then(ready => { if (ready) playSound('jump'); });
});

// ---------- Retry button ----------
const retryBtn = document.getElementById('retryBtn');
retryBtn.addEventListener('click', restartGame);

soundBtn.addEventListener('click', e => {
  e.preventDefault();
  soundEnabled = !soundEnabled;
  saveSoundEnabled();
  updateSoundButton();
  if (soundEnabled) {
    primeAudio().then(ready => { if (ready) playSound('coin'); });
  }
});

for (const eventName of ['contextmenu', 'selectstart', 'dragstart']) {
  soundBtn.addEventListener(eventName, e => e.preventDefault());
}

function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 30,
      color,
      size: 2 + Math.random() * 3,
    });
  }
}

// ---------- Update ----------
function update() {
  // Level-complete and won states pause gameplay
  if (state === 'eaten') {
    eatenTimer--;
    if (eatenScene && eatenTimer % 5 === 0) {
      spawnParticles(eatenScene.x, eatenScene.y + 10, '#26C6DA', 4);
    }
    for (const pt of particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life--;
    }
    particles = particles.filter(p => p.life > 0);
    if (eatenTimer <= 0) finishAlligatorRespawn();
    return;
  }

  if (state === 'complete') {
    completeTimer--;
    // Celebratory particles bursting from player
    if (completeTimer % 6 === 0) {
      const colors = ['#FFD600','#FF4081','#4FC3F7','#81C784','#BA68C8'];
      spawnParticles(
        player.x + player.w/2, player.y + player.h/2,
        colors[Math.floor(Math.random()*colors.length)], 8
      );
    }
    // Update particles
    for (const pt of particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life--;
    }
    particles = particles.filter(p => p.life > 0);

    if (completeTimer <= 0) {
      totalScore += score;
      if (currentLevel >= LEVELS.length - 1) {
        state = 'won';
        retryBtn.classList.add('show');
        playSound('win');
      } else {
        currentLevel++;
        loadLevel(currentLevel);
        state = 'playing';
      }
    }
    return;
  }
  if (state === 'won') {
    for (const pt of particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life--;
    }
    particles = particles.filter(p => p.life > 0);
    return;
  }

  // Horizontal input (arrows or A/D)
  const leftHeld  = keys['ArrowLeft']  || keys['KeyA'];
  const rightHeld = keys['ArrowRight'] || keys['KeyD'];
  if (leftHeld)  { player.vx -= player.speed; player.facing = -1; }
  if (rightHeld) { player.vx += player.speed; player.facing = 1; }
  if (!leftHeld && !rightHeld) player.vx *= player.friction;

  player.vx = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.vx));

  // Jump
  if (keys['Space'] || jumpBuffer > 0) performJump();
  if (jumpBuffer > 0) jumpBuffer--;

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 18) player.vy = 18;

  // Move + collide X
  player.x += player.vx;
  for (const p of platforms) {
    if (rectCollide(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Move + collide Y
  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms) {
    if (rectCollide(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        if (!player.onGround && player.vy > 4) {
          spawnParticles(player.x + player.w/2, player.y + player.h, '#A5D6A7', 4);
          player.squash = 0.7; // squash on land
        }
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // World bounds
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_W) player.x = WORLD_W - player.w;

  for (const water of waterGaps) {
    if (rectCollide(player, water) && player.y + player.h > water.y + 8) {
      startAlligatorEating(water);
      break;
    }
  }

  // Finish flag — touching it completes the level
  if (player.x + player.w > finishX && state === 'playing') {
    state = 'complete';
    completeTimer = 150; // ~2.5 seconds at 60fps
    playSound('complete');
    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#FFD600', 24);
  }

  // Fell off the world -> respawn
  if (player.y > H + 100) {
    respawnPlayer();
  }

  // Squash recovery
  player.squash += (1 - player.squash) * 0.15;

  // Blink
  player.blink--;
  if (player.blink < -200) player.blink = 8;

  // Camera
  const targetCam = player.x - W / 2 + player.w / 2;
  camX += (targetCam - camX) * 0.1;
  camX = Math.max(0, Math.min(WORLD_W - W, camX));

  // Coins
  for (const c of coins) {
    if (!c.taken) {
      c.t += 0.1;
      if (Math.abs(player.x + player.w/2 - c.x) < 22 &&
          Math.abs(player.y + player.h/2 - c.y) < 22) {
        c.taken = true;
        score++;
        playSound('coin');
        spawnParticles(c.x, c.y, '#FFD600', 12);
      }
    }
  }

  // Clouds drift
  for (const cl of clouds) {
    cl.x -= cl.speed;
    if (cl.x < camX - 200) cl.x = camX + W + 200;
  }

  // Particles
  for (const pt of particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.3;
    pt.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Draw ----------
function draw() {
  // Sky gradient (per-level)
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, skyTop);
  sky.addColorStop(1, skyBottom);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Far hills (parallax 0.3)
  ctx.fillStyle = currentTheme.hillFar;
  for (const h of hills) {
    const hx = h.x - camX * 0.3;
    if (hx + h.r * 2 > 0 && hx - h.r * 2 < W) {
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y + 20, h.r, Math.PI, 0);
      ctx.fill();
    }
  }

  // Mid hills (parallax 0.55, darker)
  ctx.fillStyle = currentTheme.hillMid;
  for (let i = 0; i < hills.length; i += 2) {
    const h = hills[i];
    const hx = h.x * 1.2 - camX * 0.55;
    if (hx + h.r * 2 > 0 && hx - h.r * 2 < W) {
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y + 30, h.r * 0.85, Math.PI, 0);
      ctx.fill();
    }
  }

  if (jungleTrees.length) {
    for (const tree of jungleTrees) {
      drawJungleTree(tree.x - camX * 0.42, GROUND_Y + 18, tree);
    }
  }

  // Clouds (parallax 0.5)
  for (const cl of clouds) {
    drawCloud(cl.x - camX * 0.5, cl.y, cl.s);
  }

  // Translate world for foreground
  ctx.save();
  ctx.translate(-camX, 0);

  // Platforms
  for (const p of platforms) {
    drawPlatform(p);
  }

  for (const water of waterGaps) drawWaterGap(water);

  // Flowers
  for (const f of flowers) drawFlower(f.x, f.y, f.color);

  // Coins
  for (const c of coins) if (!c.taken) drawCoin(c.x, c.y, c.t);

  // Finish flag
  drawFinishFlag(finishX, GROUND_Y);

  // Particles
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life / 30);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  if (state === 'eaten' && eatenScene) drawEatenPlayer();
  else drawPlayer();

  ctx.restore();

  // HUD
  drawHUD();

  // Overlay messages
  if (state === 'complete') drawCompleteOverlay();
  if (state === 'won') drawWonOverlay();
}

function drawFinishFlag(x, groundY) {
  // Pole
  ctx.fillStyle = '#5D4037';
  ctx.fillRect(x - 3, groundY - 130, 6, 130);
  // Pole top knob
  ctx.fillStyle = '#FFD600';
  ctx.beginPath(); ctx.arc(x, groundY - 132, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#FF8F00'; ctx.lineWidth = 1.5; ctx.stroke();

  // Waving flag
  const t = performance.now() / 200;
  ctx.fillStyle = '#FF5252';
  ctx.beginPath();
  ctx.moveTo(x, groundY - 125);
  for (let i = 0; i <= 10; i++) {
    const fx = x + (i / 10) * 60;
    const fy = groundY - 125 + Math.sin(t + i * 0.6) * 4;
    ctx.lineTo(fx, fy);
  }
  ctx.lineTo(x + 55, groundY - 95);
  for (let i = 10; i >= 0; i--) {
    const fx = x + (i / 10) * 60;
    const fy = groundY - 95 + Math.sin(t + i * 0.6) * 4;
    ctx.lineTo(fx, fy);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#C62828';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Star on flag
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', x + 28, groundY - 110 + Math.sin(t + 3) * 3);
}

function drawCompleteOverlay() {
  // Dim background
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(0, 0, W, H);

  // Bouncy entrance
  const elapsed = 150 - completeTimer;
  const scale = Math.min(1, elapsed / 20);
  const bounce = Math.sin(elapsed * 0.15) * 4;

  ctx.save();
  ctx.translate(W / 2, H / 2 + bounce);
  ctx.scale(scale, scale);

  // Title shadow
  ctx.font = 'bold 64px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText('LEVEL COMPLETE!', 5, 5);

  // Title with stroke
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#E65100';
  ctx.strokeText('LEVEL COMPLETE!', 0, 0);
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText('LEVEL COMPLETE!', 0, 0);

  // Subtitle
  ctx.font = 'bold 22px "Comic Sans MS", sans-serif';
  ctx.fillStyle = 'white';
  ctx.fillText(
    `★ ${score} / ${coins.length} stars collected`,
    0, 50
  );

  if (currentLevel < LEVELS.length - 1) {
    ctx.font = 'bold 18px "Comic Sans MS", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('Get ready for ' + LEVELS[currentLevel + 1].name + '...', 0, 90);
  }

  ctx.restore();
}

function drawWonOverlay() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 300;
  ctx.save();
  ctx.translate(W / 2, H / 2);

  // Title
  ctx.font = 'bold 84px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillText('GAME WON', 6, 6 + Math.sin(t) * 3);
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#E65100';
  ctx.strokeText('GAME WON', 0, Math.sin(t) * 3);
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText('GAME WON', 0, Math.sin(t) * 3);

  // Stats
  ctx.font = 'bold 24px "Comic Sans MS", sans-serif';
  ctx.fillStyle = 'white';
  ctx.fillText(`★ ${totalScore} stars collected`, 0, 70);

  ctx.restore();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 18 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 40 * s, y, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 22 * s, y + 8 * s, 18 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawJungleTree(x, groundY, tree) {
  if (x + tree.crown < -60 || x - tree.crown > W + 60) return;

  const trunkTop = groundY - tree.h;
  ctx.fillStyle = 'rgba(68, 44, 22, 0.58)';
  roundRect(x - tree.w / 2, trunkTop, tree.w, tree.h + 18, 10);
  ctx.fill();

  ctx.fillStyle = 'rgba(6, 77, 44, 0.55)';
  for (let i = 0; i < 5; i++) {
    const offset = (i - 2) * tree.crown * 0.45;
    ctx.beginPath();
    ctx.arc(x + offset, trunkTop + 8 + Math.abs(i - 2) * 8, tree.crown, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(18, 140, 74, 0.42)';
  ctx.beginPath();
  ctx.arc(x, trunkTop - 12, tree.crown * 0.92, 0, Math.PI * 2);
  ctx.fill();
}

function drawWaterGap(water) {
  const t = performance.now() / 240;
  const waterTop = water.y + 4;
  const g = ctx.createLinearGradient(0, waterTop, 0, H);
  g.addColorStop(0, '#26C6DA');
  g.addColorStop(1, '#006064');
  ctx.fillStyle = g;
  ctx.fillRect(water.x, waterTop, water.w, H - waterTop);

  ctx.strokeStyle = 'rgba(178, 235, 242, 0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= water.w; i += 12) {
    const wx = water.x + i;
    const wy = waterTop + 6 + Math.sin(t + i * 0.2 + water.x * 0.01) * 4;
    if (i === 0) ctx.moveTo(wx, wy);
    else ctx.lineTo(wx, wy);
  }
  ctx.stroke();

  drawAlligator(water.x + water.w / 2, waterTop + 20, Math.max(0.7, Math.min(1.1, water.w / 120)));
}

function drawAlligator(x, y, s, bite = 0) {
  const t = performance.now() / 180;
  const chomp = Math.max(bite, Math.max(0, Math.sin(t + x * 0.03)) * 10);

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  ctx.fillStyle = '#2E7D32';
  roundRect(-36, -8, 72, 18, 8);
  ctx.fill();
  ctx.strokeStyle = '#1B5E20';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#388E3C';
  roundRect(-44, -18 - chomp * 0.2, 58, 16, 7);
  ctx.fill();
  roundRect(-44, 2 + chomp * 0.2, 58, 13, 7);
  ctx.fill();

  ctx.fillStyle = 'white';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-35 + i * 10, -3);
    ctx.lineTo(-30 + i * 10, 5 + chomp * 0.25);
    ctx.lineTo(-25 + i * 10, -3);
    ctx.fill();
  }

  ctx.fillStyle = '#102A18';
  ctx.beginPath();
  ctx.arc(10, -13, 3, 0, Math.PI * 2);
  ctx.arc(24, -12, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawEatenPlayer() {
  const progress = 1 - eatenTimer / 58;
  const wiggle = Math.sin(progress * Math.PI * 8) * (1 - progress) * 8;
  const mouthX = eatenScene.x;
  const mouthY = eatenScene.y - 2;
  const boxX = eatenScene.boxStartX + (mouthX - eatenScene.boxStartX) * progress + wiggle;
  const boxY = eatenScene.boxStartY + (mouthY - eatenScene.boxStartY) * progress + progress * 18;
  const boxScale = Math.max(0.08, 1 - progress * 0.92);

  drawAlligator(mouthX, eatenScene.y, eatenScene.scale * (1 + progress * 0.18), 22 * (1 - progress) + 2);

  ctx.save();
  ctx.translate(boxX, boxY);
  ctx.rotate(Math.sin(progress * Math.PI * 5) * 0.35);
  ctx.scale(boxScale, boxScale);

  roundRect(-20, -20, 40, 40, 7);
  const grad = ctx.createLinearGradient(0, -20, 0, 20);
  grad.addColorStop(0, '#FFB74D');
  grad.addColorStop(0.5, '#FF9800');
  grad.addColorStop(1, '#F57C00');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(-7, -4, 5, 0, Math.PI * 2);
  ctx.arc(7, -4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3E2723';
  ctx.beginPath();
  ctx.arc(-7, -4, 2, 0, Math.PI * 2);
  ctx.arc(7, -4, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 9, 5, 0, Math.PI);
  ctx.fill();

  ctx.restore();
}

function drawPlatform(p) {
  // Dirt body
  ctx.fillStyle = currentTheme.dirt;
  ctx.fillRect(p.x, p.y + 14, p.w, p.h - 14);
  // Dirt texture dots
  ctx.fillStyle = currentTheme.dirtDot;
  for (let i = 0; i < p.w; i += 24) {
    ctx.beginPath();
    ctx.arc(p.x + i + 12, p.y + 28 + (i % 2) * 10, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // Grass top (rounded)
  ctx.fillStyle = currentTheme.top;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y + 16);
  ctx.lineTo(p.x, p.y + 6);
  ctx.quadraticCurveTo(p.x + 6, p.y, p.x + 14, p.y + 4);
  for (let i = 14; i < p.w - 14; i += 14) {
    ctx.quadraticCurveTo(p.x + i + 7, p.y - 4, p.x + i + 14, p.y + 4);
  }
  ctx.quadraticCurveTo(p.x + p.w - 6, p.y, p.x + p.w, p.y + 6);
  ctx.lineTo(p.x + p.w, p.y + 16);
  ctx.closePath();
  ctx.fill();
  // Lighter grass highlight
  ctx.fillStyle = currentTheme.topLight;
  for (let i = 6; i < p.w - 6; i += 14) {
    ctx.beginPath();
    ctx.arc(p.x + i + 4, p.y + 2, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // Grass blades
  ctx.strokeStyle = currentTheme.blade;
  ctx.lineWidth = 1.5;
  for (let i = 8; i < p.w - 8; i += 18) {
    ctx.beginPath();
    ctx.moveTo(p.x + i, p.y + 4);
    ctx.lineTo(p.x + i + 2, p.y - 4);
    ctx.stroke();
  }
}

function drawFlower(x, y, color) {
  ctx.fillStyle = '#388E3C';
  ctx.fillRect(x - 1, y - 8, 2, 8);
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * 3, y - 10 + Math.sin(a) * 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#FFEB3B';
  ctx.beginPath();
  ctx.arc(x, y - 10, 1.8, 0, Math.PI * 2);
  ctx.fill();
}

function drawCoin(x, y, t) {
  const wob = Math.abs(Math.cos(t));
  ctx.save();
  ctx.translate(x, y + Math.sin(t) * 3);
  ctx.scale(wob * 0.7 + 0.3, 1);
  ctx.fillStyle = '#FFD600';
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#FF8F00';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#FFEE58';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 1);
  ctx.restore();
}

function drawPlayer() {
  const sq = player.squash;
  const w = player.w / sq;
  const h = player.h * sq;
  const cx = player.x + player.w / 2;
  const by = player.y + player.h; // bottom y
  const x = cx - w / 2;
  const y = by - h;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(cx, GROUND_Y, 18, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body (orange box with rounded corners)
  roundRect(x, y, w, h, 7);
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, '#FFB74D');
  grad.addColorStop(0.5, '#FF9800');
  grad.addColorStop(1, '#F57C00');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(x + 5, y + 5, w * 0.35, h * 0.2, 4);
  ctx.fill();

  // Face
  const eyeY = y + h * 0.4;
  const mouthY = y + h * 0.65;
  const eyeOffsetX = player.facing * 4;

  // Eye whites
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(x + w * 0.32 + eyeOffsetX, eyeY, 6, 0, Math.PI * 2);
  ctx.arc(x + w * 0.68 + eyeOffsetX, eyeY, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3E2723';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Pupils (look in movement direction)
  if (player.blink > 0) {
    ctx.strokeStyle = '#3E2723';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.32 + eyeOffsetX - 4, eyeY);
    ctx.lineTo(x + w * 0.32 + eyeOffsetX + 4, eyeY);
    ctx.moveTo(x + w * 0.68 + eyeOffsetX - 4, eyeY);
    ctx.lineTo(x + w * 0.68 + eyeOffsetX + 4, eyeY);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#3E2723';
    const pupilShift = player.facing * 1.5;
    ctx.beginPath();
    ctx.arc(x + w * 0.32 + eyeOffsetX + pupilShift, eyeY + 1, 2.5, 0, Math.PI * 2);
    ctx.arc(x + w * 0.68 + eyeOffsetX + pupilShift, eyeY + 1, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mouth
  ctx.strokeStyle = '#3E2723';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (!player.onGround) {
    // Open mouth (excited)
    ctx.fillStyle = '#5D2E0F';
    ctx.beginPath();
    ctx.arc(x + w / 2 + eyeOffsetX, mouthY + 2, 4, 0, Math.PI);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x + w / 2 + eyeOffsetX, mouthY, 5, 0.15, Math.PI - 0.15);
    ctx.stroke();
  }

  // Cheeks
  ctx.fillStyle = 'rgba(255, 105, 97, 0.6)';
  ctx.beginPath();
  ctx.arc(x + w * 0.22 + eyeOffsetX, mouthY - 2, 3, 0, Math.PI * 2);
  ctx.arc(x + w * 0.78 + eyeOffsetX, mouthY - 2, 3, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawHUD() {
  // Coin counter
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(15, 15, 150, 40, 12);
  ctx.fill();
  // little coin icon
  ctx.fillStyle = '#FFD600';
  ctx.beginPath(); ctx.arc(40, 35, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#FF8F00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#FF8F00';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', 40, 36);
  // text
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('× ' + score + ' / ' + coins.length, 60, 36);

  // Level badge (right side)
  const label = 'LEVEL ' + (currentLevel + 1) + ' — ' + LEVELS[currentLevel].name;
  ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  roundRect(W - tw - 45, 15, tw + 30, 40, 12);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, W - tw - 30, 36);
}

// ---------- Loop ----------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loadLevel(0);
loop();
</script>
